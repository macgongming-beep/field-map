<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://oapi.map.naver.com" />
    <link rel="dns-prefetch" href="https://oapi.map.naver.com" />
    <!-- 지도 타일 서버 — 미리 연결해 두면 지도를 처음 열 때 붙는 시간이 줄어든다 -->
    <link rel="preconnect" href="https://map.pstatic.net" crossorigin />
    <link rel="preconnect" href="https://nrbe.pstatic.net" crossorigin />
    <link rel="dns-prefetch" href="https://map.pstatic.net" />
    <link rel="dns-prefetch" href="https://nrbe.pstatic.net" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css" />
    <title>__FIELD_MAP_TITLE__</title>
    <meta name="description" content="__FIELD_MAP_DESCRIPTION__" />
    <meta property="og:title" content="__FIELD_MAP_TITLE__" />
    <meta property="og:description" content="__FIELD_MAP_DESCRIPTION__" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__FIELD_MAP_TITLE__" />
  </head>
  <body>
    <!-- 앱을 껐다 켤 때 JS 를 받는 동안 화면이 하얗다. React 안의 '불러오는 중'
         은 React 가 뜬 뒤에야 나오므로 그 앞을 못 덮는다. 그래서 여기 직접 둔다.
         React 가 뜨면 이 안이 통째로 갈리므로 따로 지울 필요가 없다. -->
    <div id="root">
      <div style="display:grid;place-items:center;height:100svh;gap:14px;font-family:Pretendard,-apple-system,system-ui,sans-serif">
        <div style="width:38px;height:38px;border:3px solid #e5e7eb;border-top-color:#2563eb;border-radius:50%;animation:fm-spin .8s linear infinite"></div>
        <p style="margin:0;color:#6b7280;font-size:14px;font-weight:600">필드맵 여는 중…</p>
      </div>
      <style>@keyframes fm-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
